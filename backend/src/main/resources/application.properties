spring.application.name=signalinvest-api
server.port=${SERVER_PORT:8080}

spring.datasource.url=${FIAP_ORACLE_URL}
spring.datasource.username=${FIAP_ORACLE_USER}
spring.datasource.password=${FIAP_ORACLE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

server.servlet.session.timeout=30m
server.servlet.session.cookie.name=SIGNALINVEST_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

app.frontend.origem=${FRONTEND_ORIGEM:http://localhost:5173}
